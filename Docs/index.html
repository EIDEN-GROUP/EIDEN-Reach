document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){render(route.dataset.route);return;}const nav=e.target.closest('.nav-item');if(nav){render(nav.dataset.route);return;}const act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act);return;}const folder=e.target.closest('[data-folder]');if(folder){document.querySelectorAll('.folder-link').forEach(n=>n.classList.toggle('active',n===folder));document.getElementById('mailFolderTitle').textContent=folder.dataset.folder;toast(`${folder.dataset.folder} folder selected`,'Messages are illustrative; connect a mailbox to load live data.');return;}const thread=e.target.closest('[data-thread]');if(thread){document.querySelectorAll('.thread').forEach(n=>n.classList.toggle('active',n===thread));const d=[{s:'Re: Improving Northstar’s pipeline',n:'Sarah Johnson',e:'sarah@northstar.io',t:'Today, 10:18 AM',initial:'SJ',body:'<p>Hi Abde,</p><p>Thanks for reaching out. This looks relevant to what we’re trying to improve at Northstar, especially around keeping lead follow-ups consistent.</p><p>Could we schedule a quick call next week to discuss how this might fit into our current process?</p><p>Best,<br>Sarah</p>'},{s:'Re: Partnership conversation',n:'Michael Kim',e:'michael@atlasworks.com',t:'Today, 9:42 AM',initial:'MK',body:'<p>Hi Abde,</p><p>Thanks for following up. We’re reviewing how to keep our sales activity organized across the team.</p><p>Could you send me a short overview and the main steps involved?</p><p>Regards,<br>Michael</p>'},{s:'Re: Growth workflow proposal',n:'Laura Martinez',e:'laura@brightpath.co',t:'Yesterday',initial:'LM',body:'<p>Hi Abde,</p><p>Thanks for sharing the overview. I’ll share this with the team and get back to you once we’ve had a chance to review it.</p><p>Best,<br>Laura</p>'},{s:'Introduction from Youssef',n:'David Nguyen',e:'david@fablegroup.com',t:'Oct 24',initial:'DN',body:'<p>Hello Abde,</p><p>Nice to meet you. Youssef thought we might have a useful conversation. We’re reviewing a few options and would be interested in learning more.</p><p>Best,<br>David</p>'},{s:'Re: Agency collaboration',n:'Emily Parker',e:'emily@orbithealth.io',t:'Oct 23',initial:'EP',body:'<p>Hi Abde,</p><p>Would Tuesday afternoon work on your side? I can bring our operations lead to the conversation too.</p><p>Thanks,<br>Emily</p>'}][Number(thread.dataset.thread)];document.getElementById('readerSubject').textContent=d.s;document.getElementById('readerSender').innerHTML=`${d.n} <span class="muted" style="font-weight:450">&lt;${d.e}&gt;</span>`;document.getElementById('readerTime').textContent=d.t;document.getElementById('readerBody').innerHTML=d.body+`<div class="mail-signature"><strong>${d.n}</strong><br>${d.n==='Sarah Johnson'?'VP of Marketing · Northstar Labs':'Business contact'}</div>`;return;}const filter=e.target.closest('[data-filter]');if(filter){const group=filter.parentElement;group.querySelectorAll('.seg-tab').forEach(n=>n.classList.toggle('active',n===filter));toast(`${filter.dataset.filter} view selected`,'Preview filter state only.');return;}const settings=e.target.closest('[data-settings]');if(settings){document.querySelectorAll('.settings-link').forEach(n=>n.classList.toggle('active',n===settings));const name=settings.dataset.settings;const data={general:['Workspace settings','Configure the default identity and operating rules for EIDEN Reach.'],mail:['Email & sending','Configure sender eligibility, sequence windows and safety controls.'],pipeline:['Pipeline settings','Configure sales pipelines, stages, required fields and forecast rules.'], 'custom-fields':['Custom fields','Manage structured data fields used by contacts, companies and deals.'],permissions:['Permissions','Review roles, ownership rules and sensitive action access.'],privacy:['Privacy & retention','Configure data retention, suppression, exports and deletion policies.'],notifications:['Notifications','Set reminders, reply alerts, campaign health warnings and digest preferences.']};const cur=data[name]||data.general;document.getElementById('settingsContent').innerHTML=`<div class="settings-title">${cur[0]}</div><div class="settings-description">${cur[1]}</div><div class="setting-field"><div><div class="field-title">Enabled</div><div class="field-help">Enable this setting in the connected production workspace.</div></div><button class="switch on" data-action="toggle-switch" aria-label="Enabled" aria-pressed="true"></button></div><div class="setting-field"><div><div class="field-title">Default behavior</div><div class="field-help">Use a documented, least-surprise default.</div></div><select class="form-select"><option>Require confirmation for high-impact actions</option><option>Disabled</option></select></div><div class="setting-field"><div><div class="field-title">Audit changes</div><div class="field-help">Sensitive changes should include actor, timestamp, result and request context.</div></div><button class="switch on" data-action="toggle-switch" aria-label="Audit changes" aria-pressed="true"></button></div><div class="setting-field"><div><div class="field-title">Important note</div><div class="field-help">Settings in this preview are local only. Production settings must be validated and stored securely.</div></div>${status('Preview only','warning')}</div>`;return;}});
document.addEventListener('input',e=>{if(e.target.matches('[data-table-search]')){const q=e.target.value.toLowerCase();const table=e.target.closest('.panel')?.querySelector('table[data-searchable-table]');if(table){table.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none');}}if(e.target.id==='threadSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('.thread').forEach(t=>t.style.display=t.innerText.toLowerCase().includes(q)?'':'none');}if(e.target.id==='globalSearch'&&e.target.value.trim().length>1){const q=e.target.value.trim().toLowerCase();if(q.includes('@')||q.includes('contact')||q.includes('sarah')){document.getElementById('crumbCurrent').textContent='Search preview';}}});
document.addEventListener('change',e=>{if(e.target.matches('.task-check')){const row=e.target.closest('tr');row.querySelector('.task-name')?.style.setProperty('text-decoration',e.target.checked?'line-through':'none');row.style.opacity=e.target.checked?'.55':'1';const left=document.querySelectorAll('.task-check:checked').length;const f=document.getElementById('taskFooter');if(f)f.textContent=`${left} task${left===1?'':'s'} marked complete in preview · Nothing was saved.`;}});
