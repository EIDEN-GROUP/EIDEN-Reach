name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  APP_NAME: eiden-reach
  DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAILBOX_WORKER_URL: ${{ secrets.VITE_MAILBOX_WORKER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy with rsync over SSH
        uses: easingthemes/ssh-deploy@v5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT || 22 }}
          TARGET: "${{ secrets.VPS_DEPLOY_PATH }}"
          SCRIPT_BEFORE: |
            set -e
            mkdir -p "${{ secrets.VPS_DEPLOY_PATH }}"
          SCRIPT_AFTER: |
            set -e
            sudo systemctl reload "${{ secrets.VPS_SERVICE }}" 2>/dev/null || true
            whoami && echo "Deployed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

  deploy-worker:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - working-directory: workers/mailbox
        run: npx wrangler deploy
          ## Optional: make sure secrets are already set:
          # wrangler secret put DISPATCH_TOKEN
          # wrangler secret put SLACK_WEBHOOK_URL
